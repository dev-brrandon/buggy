openapi: 3.1.0
info:
  title: Legit Assistant API
  version: 1.0.0
  description: >-
    Versioned HTTP API for Legit Assistants. All unsafe POST operations require Idempotency-Key.
    Authentication, authoritative actor resolution, authorization, policy and execution remain owned by
    the Phase-13 runtime pipeline; this API does not define a parallel security authority.
servers:
  - url: /api/assistant/v1
security:
  - PanelServiceAuth: []
    PanelUserContext: []
paths:
  /assistants:
    get:
      operationId: listAssistants
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/PageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /assistants/{id}:
    get:
      operationId: getAssistant
      parameters: [ { $ref: '#/components/parameters/ResourceId' } ]
      responses:
        '200': { $ref: '#/components/responses/ResourceResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /conversations:
    post:
      operationId: createConversation
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses:
        '200': { $ref: '#/components/responses/MutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /conversations/{id}:
    get:
      operationId: getConversation
      parameters: [ { $ref: '#/components/parameters/ResourceId' } ]
      responses:
        '200': { $ref: '#/components/responses/ResourceResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /conversations/{id}/messages:
    post:
      operationId: appendConversationMessage
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses:
        '200': { $ref: '#/components/responses/MutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /conversations/{id}/cancel:
    post:
      operationId: cancelConversation
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses:
        '200': { $ref: '#/components/responses/MutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /bugs:
    get:
      operationId: listBugs
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/PageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: createBug
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses:
        '200': { $ref: '#/components/responses/MutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /bugs/{id}:
    get:
      operationId: getBug
      parameters: [ { $ref: '#/components/parameters/ResourceId' } ]
      responses:
        '200': { $ref: '#/components/responses/ResourceResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /bugs/{id}/status:
    post:
      operationId: updateBugStatus
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses:
        '200': { $ref: '#/components/responses/MutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /bugs/{id}/relations:
    post:
      operationId: addBugRelation
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses:
        '200': { $ref: '#/components/responses/MutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /knowledge/search:
    get:
      operationId: searchKnowledge
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/PageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /knowledge/documents/{id}:
    get:
      operationId: getKnowledgeDocument
      parameters: [ { $ref: '#/components/parameters/ResourceId' } ]
      responses:
        '200': { $ref: '#/components/responses/ResourceResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /requests:
    post:
      operationId: createRequest
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses:
        '200': { $ref: '#/components/responses/MutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /requests/{id}:
    get:
      operationId: getRequest
      parameters: [ { $ref: '#/components/parameters/ResourceId' } ]
      responses:
        '200': { $ref: '#/components/responses/ResourceResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /requests/{id}/approve:
    post:
      operationId: approveRequest
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses:
        '200': { $ref: '#/components/responses/MutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /requests/{id}/deny:
    post:
      operationId: denyRequest
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses:
        '200': { $ref: '#/components/responses/MutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /requests/{id}/cancel:
    post:
      operationId: cancelRequest
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses:
        '200': { $ref: '#/components/responses/MutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /supervisor/assistants:
    get:
      operationId: listSupervisorAssistants
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/PageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /supervisor/assistants/{id}/health:
    get:
      operationId: getSupervisorAssistantHealth
      parameters: [ { $ref: '#/components/parameters/ResourceId' } ]
      responses:
        '200': { $ref: '#/components/responses/ResourceResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /supervisor/assistants/{id}/failures:
    get:
      operationId: getSupervisorAssistantFailures
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/PageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /panel/status:
    get:
      operationId: getPanelIntegrationStatus
      responses:
        '200':
          description: Per-surface integration/degraded state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanelIntegrationHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /panel/audit:
    get:
      operationId: searchPanelAudit
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 256 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/PageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /panel/rate-limits:
    get:
      operationId: getPanelRateLimits
      responses:
        '200': { $ref: '#/components/responses/ResourceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /panel/feature-flags:
    get:
      operationId: getPanelFeatureFlags
      responses:
        '200': { $ref: '#/components/responses/ResourceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /panel/events:
    get:
      operationId: streamPanelEvents
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        '200':
          description: Bounded sanitized realtime event stream
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    PanelServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: HMAC-SHA256 request-bound service token
      description: Trusted Panel Backend service authentication. Token is bound to X-Request-Id and one-time JTI.
    PanelUserContext:
      type: apiKey
      in: header
      name: X-Legit-Panel-Context
      description: Signed request/trace/service-bound human identity context. Carries no ranks or permissions.
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 192, pattern: '^[A-Za-z0-9._:-]+$' }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque versioned pagination cursor. Clients must not parse or modify it.
      schema: { type: string, maxLength: 256 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Required on every unsafe POST. Same key plus same canonical payload replays the original semantic result;
        same key plus a different payload is rejected as an idempotency conflict. V1 storage is process-local.
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
  requestBodies:
    Command:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiCommandRequest' }
  responses:
    ResourceResponse:
      description: Resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResourceView' }
    PageResponse:
      description: Cursor-paginated collection
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiPage' }
    MutationResponse:
      description: Mutation result
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiMutationResult' }
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Conflict:
      description: State, revision or idempotency conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Unavailable:
      description: Required backend/dependency unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Unauthorized:
      description: Panel service authentication failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Forbidden:
      description: Signed user context or authorization denied
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    ApiCommandRequest:
      type: object
      additionalProperties: true
      maxProperties: 64
    ApiResourceView:
      type: object
      required: [id, attributes]
      properties:
        id: { type: string }
        attributes: { type: object, additionalProperties: true }
    ApiMutationResult:
      type: object
      required: [resource, idempotentReplay]
      properties:
        resource: { $ref: '#/components/schemas/ApiResourceView' }
        idempotentReplay: { type: boolean }
    ApiPage:
      type: object
      required: [items, pageSize, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiResourceView' }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        hasMore: { type: boolean }
        nextCursor: { type: [string, 'null'] }
    PanelIntegrationHealth:
      type: object
      required: [state, surfaces, checkedAt]
      properties:
        state: { type: string, enum: [AVAILABLE, DEGRADED, UNAVAILABLE] }
        surfaces:
          type: object
          additionalProperties:
            type: object
            required: [surface, availability, safeCode]
            properties:
              surface: { type: string }
              availability: { type: string, enum: [AVAILABLE, DEGRADED, UNAVAILABLE] }
              safeCode: { type: string }
        checkedAt: { type: string, format: date-time }
    ApiError:
      type: object
      required: [errorCode, message, requestId, retryable, details]
      properties:
        errorCode: { type: string }
        message: { type: string }
        requestId: { type: string }
        retryable: { type: boolean }
        details: { type: object, additionalProperties: { type: string } }
