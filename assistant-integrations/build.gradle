description = 'Infrastructure adapters and external integration boundaries.'

def postgresqlDriver = files(rootProject.file('vendor/postgresql/postgresql-42.7.13.jar'))

dependencies {
    api project(':assistant-core')
    implementation project(':assistant-integration-contracts')
    implementation project(':assistant-security')
    implementation project(':assistant-buggy')
    implementation project(':assistant-conversations')
    implementation project(':assistant-knowledge')
    implementation project(':assistant-bugs')
    implementation project(':assistant-requests')
    implementation project(':assistant-persistence')
    implementation project(':assistant-observability')
    compileOnly files(rootProject.file('vendor/foundation/LegitPlatform-API-0.1.2-dev.6.jar'))
    runtimeOnly postgresqlDriver
}

sourceSets {
    selfTest {
        java.srcDir 'src/selfTest/java'
        compileClasspath += sourceSets.main.output + project(':assistant-security').sourceSets.main.output + project(':assistant-core').sourceSets.main.output
        runtimeClasspath += output + compileClasspath + files(rootProject.file('vendor/foundation/LegitPlatform-API-0.1.2-dev.6.jar'))
    }
    postgresTest {
        java.srcDir 'src/postgresTest/java'
        compileClasspath += sourceSets.main.output + project(':assistant-buggy').sourceSets.main.output + project(':assistant-conversations').sourceSets.main.output + project(':assistant-knowledge').sourceSets.main.output + project(':assistant-bugs').sourceSets.main.output + project(':assistant-requests').sourceSets.main.output + project(':assistant-persistence').sourceSets.main.output + project(':assistant-core').sourceSets.main.output
        runtimeClasspath += output + compileClasspath + postgresqlDriver
    }
}

configurations {
    selfTestImplementation.extendsFrom implementation
    postgresTestImplementation.extendsFrom implementation
}

dependencies {
    selfTestImplementation files(rootProject.file('vendor/foundation/LegitPlatform-API-0.1.2-dev.6.jar'))
}

tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'Runs Phase-3 NetworkCore/LegitPlatform adapter compatibility tests.'
    dependsOn tasks.named('selfTestClasses')
    classpath = sourceSets.selfTest.runtimeClasspath
    mainClass = 'de.legitserver.assistant.integrations.networkcore.Phase3NetworkCoreAdapterSelfTest'
}

tasks.register('phase6PostgresObservabilitySelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs Phase-6 live PostgreSQL latency instrumentation verification.'
    dependsOn tasks.named('postgresTestClasses')
    classpath = sourceSets.postgresTest.runtimeClasspath
    mainClass = 'de.legitserver.assistant.integrations.persistence.Phase6PostgresObservabilitySelfTest'
    doFirst {
        def jdbcUrl = System.getenv('LEGIT_ASSISTANT_POSTGRES_TEST_URL')
        def user = System.getenv('LEGIT_ASSISTANT_POSTGRES_TEST_USER')
        def password = System.getenv('LEGIT_ASSISTANT_POSTGRES_TEST_PASSWORD') ?: ''
        if (jdbcUrl == null || jdbcUrl.isBlank() || user == null || user.isBlank()) {
            throw new GradleException('LEGIT_ASSISTANT_POSTGRES_TEST_URL and LEGIT_ASSISTANT_POSTGRES_TEST_USER are required')
        }
        args jdbcUrl, user, password
    }
}

