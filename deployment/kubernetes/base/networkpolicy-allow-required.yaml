apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: legit-assistant-required-traffic
  namespace: legit-assistant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: legit-assistant
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: legit-panel
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: legit-database
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: legit-network
      ports:
        - protocol: TCP
          port: 443
