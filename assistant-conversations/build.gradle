description = 'Framework-free conversation domain, state machine, limits, expiry policy, and repository ports.'
dependencies { api project(':assistant-core') }

sourceSets {
    selfTest {
        java.srcDir 'src/selfTest/java'
        compileClasspath += sourceSets.main.output + project(':assistant-core').sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'Runs Phase-5 framework-free conversation domain verification.'
    dependsOn tasks.named('selfTestClasses')
    classpath = sourceSets.selfTest.runtimeClasspath
    mainClass = 'de.legitserver.assistant.conversations.Phase5ConversationSelfTest'
}

tasks.named('check') {
    dependsOn tasks.named('selfTest')
}
