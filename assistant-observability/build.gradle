description = 'Framework-free audit, logging, metrics, health, and trace-correlation foundation.'

dependencies {
    api project(':assistant-core')
    implementation project(':assistant-security')
}

sourceSets {
    selfTest {
        java.srcDir 'src/selfTest/java'
        compileClasspath += sourceSets.main.output + project(':assistant-core').sourceSets.main.output + project(':assistant-security').sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'Runs Phase-6 framework-free observability and audit verification.'
    dependsOn tasks.named('selfTestClasses')
    classpath = sourceSets.selfTest.runtimeClasspath
    mainClass = 'de.legitserver.assistant.observability.Phase6ObservabilitySelfTest'
}

tasks.named('check') {
    dependsOn tasks.named('selfTest')
}
