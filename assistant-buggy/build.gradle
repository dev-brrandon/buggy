description = 'Framework-free Buggy product domain built strictly on the frozen Assistant Foundation contracts.'

dependencies {
    api project(':assistant-core')
    api project(':assistant-knowledge')
    api project(':assistant-runtime')
    api project(':assistant-security')
    api project(':assistant-requests')
    api project(':assistant-pipeline')
    api project(':assistant-supervisor')
    api project(':assistant-observability')
    api project(':assistant-integration-contracts')
}

sourceSets {
    selfTest {
        java.srcDir 'src/selfTest/java'
        compileClasspath += sourceSets.main.output + project(':assistant-core').sourceSets.main.output + project(':assistant-knowledge').sourceSets.main.output + project(':assistant-runtime').sourceSets.main.output + project(':assistant-security').sourceSets.main.output + project(':assistant-requests').sourceSets.main.output + project(':assistant-pipeline').sourceSets.main.output + project(':assistant-conversations').sourceSets.main.output + project(':assistant-supervisor').sourceSets.main.output + project(':assistant-observability').sourceSets.main.output + project(':assistant-integration-contracts').sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'Runs B1 Buggy identity/runtime separation and protected identity-core verification.'
    dependsOn tasks.named('selfTestClasses')
    classpath = sourceSets.selfTest.runtimeClasspath
    mainClass = 'de.legitserver.assistant.buggy.B1BuggyIdentityRuntimeSelfTest'
}

tasks.register('personalitySelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs B2 Buggy Personality seed, evolution, learning-boundary, history and rollback verification.'
